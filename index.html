<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비비 업무현황판">
<title>비비 업무현황판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
  :root{
    --bg:#F3F4F7; --bg-2:#E9ECF3; --card:#FFFFFF; --line:rgba(17,20,28,.08);
    --text:#111318; --text-2:#5B6271; --text-3:#8B91A0; --accent:#5A4BE0; --accent-2:#8E7BFF;
    --accent-ink:#4335C9; --field:#F4F5F8; --danger:#C0392B; --danger-soft:#FCEBE8;
    --shadow:0 1px 2px rgba(16,20,30,.06), 0 24px 60px -28px rgba(16,20,30,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#08090C; --bg-2:#101218; --card:#14161C; --line:rgba(255,255,255,.08);
      --text:#F0F2F6; --text-2:#AEB4C1; --text-3:#7C8394; --accent:#9C93FF; --accent-2:#6E63E8;
      --accent-ink:#B7B0FF; --field:#1B1E26; --danger:#FF8F7F; --danger-soft:rgba(255,143,127,.12);
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 24px 60px -28px rgba(0,0,0,.9);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 80% at 12% 0%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 58%),
      radial-gradient(100% 70% at 92% 100%, color-mix(in srgb, var(--accent-2) 14%, transparent) 0%, transparent 62%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
    border-radius:24px; padding:30px 24px 22px; box-shadow:var(--shadow);
    animation:rise .42s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px) scale(.99)} to{opacity:1; transform:none}}
  .lockmark{
    width:52px; height:52px; margin:0 auto 16px; border-radius:16px; display:grid; place-items:center;
    background:linear-gradient(145deg, var(--accent), var(--accent-2)); color:#fff; font-size:24px;
    box-shadow:0 10px 24px -12px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  h1{font-size:19px; line-height:1.35; letter-spacing:-.2px; margin:0 0 6px; text-align:center; font-weight:700}
  .sub{margin:0 0 22px; text-align:center; font-size:13px; color:var(--text-2); line-height:1.5}
  form{margin:0}
  .field{position:relative}
  #pw{
    width:100%; height:56px; padding:0 16px; text-align:center;
    font-size:22px; letter-spacing:.5em; text-indent:.5em; font-weight:600;
    font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    color:var(--text); background:var(--field); border:1.5px solid var(--line); border-radius:14px;
    outline:none; transition:border-color .18s, box-shadow .18s, background .18s;
    -webkit-appearance:none; appearance:none;
  }
  #pw::placeholder{font-size:14px; letter-spacing:normal; text-indent:0; font-weight:500; color:var(--text-3)}
  #pw:focus{border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent)}
  #pw:disabled{opacity:.6}
  .btn{
    width:100%; height:52px; margin-top:12px; border:0; border-radius:14px; cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:-.1px; color:#fff;
    background:linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow:0 12px 26px -16px color-mix(in srgb, var(--accent) 90%, transparent);
    transition:transform .12s, opacity .18s, filter .18s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.985); filter:brightness(.97)}
  .btn[disabled]{opacity:.65; cursor:default}
  .msg{min-height:20px; margin:12px 0 0; font-size:12.5px; line-height:1.45; text-align:center; color:var(--text-3)}
  .msg.err{color:var(--danger); background:var(--danger-soft); border-radius:10px; padding:8px 10px; min-height:0}
  .foot{
    margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line);
    font-size:11.5px; line-height:1.55; color:var(--text-3); text-align:center; word-break:keep-all;
  }
  .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)}}
  @media (prefers-reduced-motion: reduce){ .card{animation:none} .shake{animation:none} }
</style>
</head>
<body>
<main class="card" role="main">
  <div class="lockmark" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="3"></rect>
      <path d="M8.2 10.5V7.6a3.8 3.8 0 0 1 7.6 0v2.9"></path>
      <circle cx="12" cy="15.6" r="1.35" fill="#fff" stroke="none"></circle>
    </svg>
  </div>
  <h1>비비 업무현황판</h1>
  <p class="sub">비밀번호를 입력하면 열립니다</p>

  <form id="unlockForm" novalidate>
    <div class="field">
      <input id="pw" name="pw" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" placeholder="비밀번호" aria-label="비밀번호" aria-describedby="msg">
    </div>
    <button class="btn" id="go" type="submit">잠금 해제</button>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">현황판 내용은 AES-256-GCM 으로 암호화되어 저장되어 있습니다.<br>비밀번호를 모르면 본문은 열리지 않습니다.</p>
</main>

<script>
(function () {
  "use strict";
  var payload;
  try { payload = JSON.parse(document.getElementById("dashboard-payload").textContent); }
  catch (e) { payload = null; }

  var form = document.getElementById("unlockForm");
  var input = document.getElementById("pw");
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");
  var card = document.querySelector(".card");

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function say(text, isError) {
    msg.textContent = text || "";
    msg.className = isError ? "msg err" : "msg";
  }
  function shake() {
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }

  /* 암호문 안의 HTML을 현재 문서에 안전하게 갈아끼우고 인라인 스크립트를 다시 실행한다 */
  function mount(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    if (!doc || !doc.body || !doc.body.querySelector("[data-card]")) {
      throw new Error("decoded payload is not the dashboard");
    }
    /* <html> 속성 (data-theme, lang) */
    Array.prototype.forEach.call(document.documentElement.attributes, function (a) {
      document.documentElement.removeAttribute(a.name);
    });
    Array.prototype.forEach.call(doc.documentElement.attributes, function (a) {
      document.documentElement.setAttribute(a.name, a.value);
    });
    /* head: 스타일·메타·타이틀 교체 */
    document.head.innerHTML = doc.head.innerHTML;
    /* body: 속성 + 내용 교체 */
    Array.prototype.forEach.call(document.body.attributes, function (a) {
      document.body.removeAttribute(a.name);
    });
    Array.prototype.forEach.call(doc.body.attributes, function (a) {
      document.body.setAttribute(a.name, a.value);
    });
    document.body.innerHTML = doc.body.innerHTML;
    /* 인라인 스크립트 재실행 (innerHTML 로는 실행되지 않음) */
    Array.prototype.forEach.call(doc.querySelectorAll("script"), function (old) {
      if (old.src) {
        var ext = document.createElement("script");
        ext.src = old.src;
        if (old.async) ext.async = true;
        document.body.appendChild(ext);
        return;
      }
      var s = document.createElement("script");
      Array.prototype.forEach.call(old.attributes, function (a) {
        if (a.name !== "id") s.setAttribute(a.name, a.value);
      });
      s.textContent = old.textContent;
      document.body.appendChild(s);
    });
    window.scrollTo(0, 0);
  }

  function base64Ok() { return typeof crypto !== "undefined" && crypto.subtle; }

  async function unlock(password) {
    var enc = new TextEncoder();
    var salt = b64ToBytes(payload.salt);
    var iv = b64ToBytes(payload.iv);
    var data = b64ToBytes(payload.data);
    var iter = (payload.kdf && payload.kdf.iter) || 150000;

    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
    return new TextDecoder("utf-8", { fatal: true }).decode(plain);
  }

  var busy = false;
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (busy) return;
    var pw = input.value.trim();
    if (!pw) { say("비밀번호를 입력해 주세요.", true); input.focus(); return; }
    if (!payload) { say("암호문을 읽지 못했습니다. 페이지를 새로고침해 주세요.", true); return; }
    if (!base64Ok()) { say("이 브라우저에서는 열 수 없습니다. https 주소로 열어 주세요.", true); return; }

    busy = true;
    btn.disabled = true;
    input.disabled = true;
    say("여는 중…", false);
    try {
      var text = await unlock(pw);
      var gh = null, html = text;
      try {
        var env = JSON.parse(text);
        if (env && typeof env.html === "string") { html = env.html; gh = env.gh || null; }
      } catch (e2) {}
      window.__BBHUB_GH__ = gh;
      say("", false);
      mount(html);
    } catch (e) {
      busy = false;
      btn.disabled = false;
      input.disabled = false;
      input.value = "";
      say("비밀번호가 맞지 않습니다.", true);
      shake();
      input.focus();
    }
  });

  input.addEventListener("input", function () {
    input.value = input.value.replace(/[^0-9]/g, "");
    if (msg.classList.contains("err")) say("", false);
  });

  if (payload && base64Ok()) {
    setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (e) {} }, 260);
  }
})();
</script>
